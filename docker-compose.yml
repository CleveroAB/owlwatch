# owlwatch — the canonical way to run it.
#
# The read-only host mounts below are what make the metrics describe the HOST
# rather than the container: gopsutil reads /host/proc & /host/sys (via the
# HOST_* env vars), and disk usage is measured through the host's root
# filesystem bind-mounted at /host/rootfs.
services:
  owlwatch:
    image: ghcr.io/cleveroab/owlwatch:${OWLWATCH_VERSION:-1.0.0}
    container_name: owlwatch
    # The image runs as the distroless "nonroot" user (uid 65532) and creates
    # /data owned by it. Docker copies that ownership onto a FRESH named
    # volume only — a volume left over from an earlier root-running release
    # stays root-owned, and owlwatch then fails to write its database. See
    # docs/troubleshooting.md, "readonly database (1544)".
    # Host port is overridable so a busy :8080 doesn't block deployment
    # (e.g. OWLWATCH_HOST_PORT=7676 in the environment or an .env file).
    # OWLWATCH_PORT moves the port INSIDE the container too (rarely needed —
    # for host-port conflicts OWLWATCH_HOST_PORT alone is enough); it is wired
    # into both the mapping and the server env so they can't drift apart.
    # OWLWATCH_BIND is the host interface. It defaults to loopback so a fresh
    # `docker compose up` never puts the dashboard on the network by accident;
    # set OWLWATCH_BIND=0.0.0.0 to reach it from other machines. Do that only
    # together with OWLWATCH_TOKEN (the API is unauthenticated without one) and
    # OWLWATCH_ALLOWED_HOSTS listing the hostname you'll browse to.
    ports: ["${OWLWATCH_BIND:-127.0.0.1}:${OWLWATCH_HOST_PORT:-8080}:${OWLWATCH_PORT:-8080}"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      OWLWATCH_PORT: ${OWLWATCH_PORT:-8080}
      OWLWATCH_LISTEN: 0.0.0.0
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      OWLWATCH_ROOTFS: /host/rootfs
      # Passed through from the environment / .env file — an .env only
      # interpolates ${...} in this file, it never reaches the container on
      # its own. Empty values mean "unset" to the server (no extra hosts,
      # no auth, not a hub).
      OWLWATCH_ALLOWED_HOSTS: ${OWLWATCH_ALLOWED_HOSTS:-}
      OWLWATCH_TOKEN: ${OWLWATCH_TOKEN:-}
      # To monitor several servers, deploy this same compose file on each one
      # and make ONE instance the hub by setting OWLWATCH_PEERS (see README,
      # "Monitoring multiple servers"), e.g.
      # OWLWATCH_PEERS=web1=https://web1.example.com|WEB1_TOKEN
      # in its .env. Prefer a distinct strong token for each peer.
      OWLWATCH_PEERS: ${OWLWATCH_PEERS:-}
      # Email alerts (README, "Email alerts"): set host, from and recipients
      # in your .env to enable; thresholds/durations have sensible defaults
      # (CPU 90%, mem 90%, disk 92%, GPU 90°C, sustained 5m, cooldown 30m)
      # and can be overridden with the OWLWATCH_ALERT_* variables.
      OWLWATCH_SMTP_HOST: ${OWLWATCH_SMTP_HOST:-}
      OWLWATCH_SMTP_PORT: ${OWLWATCH_SMTP_PORT:-587}
      OWLWATCH_SMTP_USER: ${OWLWATCH_SMTP_USER:-}
      OWLWATCH_SMTP_PASS: ${OWLWATCH_SMTP_PASS:-}
      OWLWATCH_SMTP_FROM: ${OWLWATCH_SMTP_FROM:-}
      OWLWATCH_ALERT_TO: ${OWLWATCH_ALERT_TO:-}
      OWLWATCH_ALERT_CPU_PCT: ${OWLWATCH_ALERT_CPU_PCT:-}
      OWLWATCH_ALERT_MEM_PCT: ${OWLWATCH_ALERT_MEM_PCT:-}
      OWLWATCH_ALERT_DISK_PCT: ${OWLWATCH_ALERT_DISK_PCT:-}
      OWLWATCH_ALERT_GPU_TEMP_C: ${OWLWATCH_ALERT_GPU_TEMP_C:-}
      OWLWATCH_ALERT_FOR: ${OWLWATCH_ALERT_FOR:-}
      OWLWATCH_ALERT_COOLDOWN: ${OWLWATCH_ALERT_COOLDOWN:-}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host/rootfs:ro,rslave # rslave so host mounts added later propagate
      - owlwatch-data:/data
    # For NVIDIA GPUs, uncomment (requires nvidia-container-toolkit):
    # gpus: all

volumes:
  owlwatch-data:
